[package]
name = "penlock-scan"
version = "0.1.0"
description = "Share-card and registered-sheet support for the full Android example"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bip39-scan = { package = "bitcoin-vision", path = "../../..", default-features = false }
bitcoin_hashes = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = { version = "0.27", default-features = false }
penlock = { path = "../penlock" }
rand = { version = "0.9", default-features = false, features = ["std_rng"] }
resvg = "0.45"
tract-onnx = { version = "0.23", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
svg2pdf = { version = "0.13", default-features = false }
pdf-writer = "0.12"

[features]
default = []
onnx = ["dep:tract-onnx", "word-extent", "bip39-scan/onnx"]
word-extent = ["bip39-scan/word-extent"]
scan-profile = ["bip39-scan/scan-profile"]
extent-experiment = ["word-extent", "scan-profile", "bip39-scan/extent-experiment"]
